<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register • POS System</title>
    <script>
      (function () {
        const stored = localStorage.getItem("theme");
        const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = stored || (systemDark ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", theme);
      })();
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-body-tertiary">
    <main class="container">
      <div class="row justify-content-center align-items-center min-vh-100 py-4">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <div class="d-flex justify-content-between align-items-start gap-2">
                <div>
                  <h1 class="h4 mb-1">Create account</h1>
                  <p class="text-body-secondary mb-4">Register to use the POS system.</p>
                </div>
                <button id="themeToggle" class="btn btn-outline-primary btn-sm" type="button">Theme</button>
              </div>

              <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>
              <div id="successBox" class="alert alert-success d-none" role="alert"></div>

              <form id="registerForm" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    autocomplete="email"
                    inputmode="email"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="password2" class="form-label">Confirm password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password2"
                    name="password2"
                    autocomplete="new-password"
                    minlength="6"
                    required
                  />
                </div>
                <button id="submitBtn" type="submit" class="btn btn-primary w-100">
                  Create account
                </button>
              </form>
              <p class="text-center text-body-secondary mt-4 mb-0 small">
                Already have an account?
                <a href="/login">Sign in</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const themeToggle = document.getElementById("themeToggle");
      const form = document.getElementById("registerForm");
      const errorBox = document.getElementById("errorBox");
      const successBox = document.getElementById("successBox");
      const submitBtn = document.getElementById("submitBtn");

      function getTheme() {
        return document.documentElement.getAttribute("data-bs-theme") || "light";
      }

      function setTheme(theme) {
        document.documentElement.setAttribute("data-bs-theme", theme);
        localStorage.setItem("theme", theme);
        updateThemeToggleLabel();
      }

      function updateThemeToggleLabel() {
        themeToggle.textContent = getTheme() === "dark" ? "Night" : "Day";
      }

      function showError(message) {
        successBox.classList.add("d-none");
        errorBox.textContent = message;
        errorBox.classList.remove("d-none");
      }

      function showSuccess(message) {
        errorBox.classList.add("d-none");
        successBox.textContent = message;
        successBox.classList.remove("d-none");
      }

      function clearMessages() {
        errorBox.textContent = "";
        errorBox.classList.add("d-none");
        successBox.textContent = "";
        successBox.classList.add("d-none");
      }

      function registerErrorMessage(code) {
        if (code === "email_and_password_required") return "Email and password are required.";
        if (code === "email_already_registered") return "That email is already registered. Sign in instead.";
        return code ? `Registration failed: ${code}` : "Registration failed.";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearMessages();

        const email = (document.getElementById("email").value || "").trim().toLowerCase();
        const password = document.getElementById("password").value || "";
        const password2 = document.getElementById("password2").value || "";

        if (!email || !password) {
          showError("Email and password are required.");
          return;
        }
        if (password.length < 6) {
          showError("Password must be at least 6 characters.");
          return;
        }
        if (password !== password2) {
          showError("Passwords do not match.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account…";

        try {
          const res = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json().catch(() => ({}));

          if (res.status === 409) {
            showError(registerErrorMessage("email_already_registered"));
            return;
          }
          if (!res.ok) {
            showError(registerErrorMessage(data.error));
            return;
          }

          showSuccess("Account created. Signing you in…");

          const loginRes = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const loginData = await loginRes.json().catch(() => ({}));

          if (!loginRes.ok || !loginData.access_token) {
            window.location.assign("/login?registered=1");
            return;
          }

          localStorage.setItem("access_token", loginData.access_token);
          localStorage.setItem("company_user_email", email);
          localStorage.removeItem("staff_token");
          localStorage.removeItem("staff_id");
          localStorage.removeItem("staff_name");
          localStorage.removeItem("staff_role");
          sessionStorage.removeItem("pos_authorized");
          window.location.assign("/staff/login");
        } catch (err) {
          showError("Network error. Please try again.");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Create account";
        }
      });

      themeToggle.addEventListener("click", () => {
        setTheme(getTheme() === "dark" ? "light" : "dark");
      });

      updateThemeToggleLabel();
    </script>
  </body>
</html>
