<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staff Login • POS System</title>
    <script>
      (function () {
        const stored = localStorage.getItem("theme");
        const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = stored || (systemDark ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", theme);
      })();
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar bg-body border-bottom">
      <div class="container">
        <span class="navbar-brand">Staff terminal</span>
        <div class="ms-auto d-flex gap-2 flex-wrap">
          <a href="/tables" id="tablesLink" class="btn btn-outline-dark btn-sm d-none">Tables</a>
          <a href="/tables/list" id="posLink" class="btn btn-outline-primary btn-sm d-none">POS</a>
          <button id="themeToggle" class="btn btn-outline-primary btn-sm" type="button">Theme</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h4 mb-1 text-center" id="screenTitle">Staff PIN</h1>
              <p class="text-body-secondary mb-3 text-center small" id="screenSubtitle">
                Enter your PIN, then press Enter or Logout.
              </p>

              <div id="bootstrapWrap" class="d-none">
                <div class="alert alert-warning" role="alert">
                  No staff configured yet. Create the first <strong>Manager</strong> to continue.
                </div>
                <div class="card border-0 bg-body-tertiary">
                  <div class="card-body p-0">
                    <div class="row g-2 align-items-end">
                      <div class="col-12">
                        <label class="form-label">Manager name</label>
                        <input id="bootName" class="form-control" value="Manager" />
                      </div>
                      <div class="col-12">
                        <label class="form-label">PIN (4–5 digits)</label>
                        <input
                          id="bootPin"
                          class="form-control"
                          inputmode="numeric"
                          pattern="\\d*"
                          maxlength="5"
                          value=""
                        />
                      </div>
                      <div class="col-12 d-grid">
                        <button id="bootBtn" class="btn btn-primary btn-lg">Create Manager</button>
                      </div>
                    </div>
                    <div id="bootError" class="alert alert-danger d-none mt-3 mb-0" role="alert"></div>
                  </div>
                </div>
              </div>

              <div id="pinPadWrap">
                <div class="text-center">
                  <div class="fs-3 fw-semibold mt-2" id="pinDots">_ _ _ _</div>
                </div>
                <div id="pinError" class="alert alert-danger d-none mt-3" role="alert"></div>
                <div class="row g-2 mt-3 justify-content-center">
                  <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 key" data-key="1">1</button></div>
                  <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 key" data-key="2">2</button></div>
                  <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 key" data-key="3">3</button></div>
                  <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 key" data-key="4">4</button></div>
                  <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 key" data-key="5">5</button></div>
                  <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 key" data-key="6">6</button></div>
                  <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 key" data-key="7">7</button></div>
                  <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 key" data-key="8">8</button></div>
                  <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 key" data-key="9">9</button></div>
                  <div class="col-4"><button id="clearPin" class="btn btn-outline-danger w-100 py-3">Clear</button></div>
                  <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 key" data-key="0">0</button></div>
                  <div class="col-4"><button id="backPin" class="btn btn-outline-secondary w-100 py-3">⌫</button></div>
                </div>
                <div class="d-grid gap-2 mt-3">
                  <button id="staffStatusBtn" class="btn btn-outline-dark btn-lg" disabled>Logged in</button>
                  <button id="staffEnterBtn" class="btn btn-success btn-lg" type="button">Enter</button>
                  <button id="staffLogoutBtn" class="btn btn-outline-secondary btn-lg" disabled>Logout</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="modal fade" id="staffRosterModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="staffRosterModalTitle">Staff status</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div id="rosterPinSection">
              <p class="text-body-secondary small mb-2">Enter manager PIN to view who is logged in.</p>
              <div class="text-center fs-3 fw-semibold mb-2" id="rosterMgrPinDots">_ _ _ _</div>
              <div id="rosterMgrPinError" class="alert alert-danger d-none mb-2" role="alert"></div>
              <div class="row g-2 justify-content-center">
                <div class="col-4"><button type="button" class="btn btn-outline-secondary w-100 py-2 roster-mgr-key" data-key="1">1</button></div>
                <div class="col-4"><button type="button" class="btn btn-outline-secondary w-100 py-2 roster-mgr-key" data-key="2">2</button></div>
                <div class="col-4"><button type="button" class="btn btn-outline-secondary w-100 py-2 roster-mgr-key" data-key="3">3</button></div>
                <div class="col-4"><button type="button" class="btn btn-outline-secondary w-100 py-2 roster-mgr-key" data-key="4">4</button></div>
                <div class="col-4"><button type="button" class="btn btn-outline-secondary w-100 py-2 roster-mgr-key" data-key="5">5</button></div>
                <div class="col-4"><button type="button" class="btn btn-outline-secondary w-100 py-2 roster-mgr-key" data-key="6">6</button></div>
                <div class="col-4"><button type="button" class="btn btn-outline-secondary w-100 py-2 roster-mgr-key" data-key="7">7</button></div>
                <div class="col-4"><button type="button" class="btn btn-outline-secondary w-100 py-2 roster-mgr-key" data-key="8">8</button></div>
                <div class="col-4"><button type="button" class="btn btn-outline-secondary w-100 py-2 roster-mgr-key" data-key="9">9</button></div>
                <div class="col-4"><button type="button" id="rosterMgrClear" class="btn btn-outline-danger w-100 py-2">Clear</button></div>
                <div class="col-4"><button type="button" class="btn btn-outline-secondary w-100 py-2 roster-mgr-key" data-key="0">0</button></div>
                <div class="col-4"><button type="button" id="rosterMgrBack" class="btn btn-outline-secondary w-100 py-2">⌫</button></div>
              </div>
              <button type="button" id="rosterViewBtn" class="btn btn-primary w-100 mt-3" disabled>View staff</button>
            </div>
            <div id="rosterListSection" class="d-none">
              <div id="rosterStaffList" class="list-group mb-3"></div>
              <div id="rosterActionError" class="alert alert-danger d-none mb-0" role="alert"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" id="rosterLogoutAsBtn" class="btn btn-outline-secondary d-none" disabled>Log out selected</button>
            <button type="button" id="rosterLoginAsBtn" class="btn btn-primary d-none" disabled>Log in selected</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="staffAuthModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body text-center py-4">
            <p class="fs-5 mb-0" id="staffAuthModalMessage"></p>
          </div>
          <div class="modal-footer border-0 justify-content-center pt-0 pb-4">
            <button type="button" id="staffAuthModalOkBtn" class="btn btn-primary btn-lg px-5">OK</button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <script>
      const themeToggle = document.getElementById("themeToggle");
      const bootstrapWrap = document.getElementById("bootstrapWrap");
      const pinPadWrap = document.getElementById("pinPadWrap");
      const bootName = document.getElementById("bootName");
      const bootPin = document.getElementById("bootPin");
      const bootBtn = document.getElementById("bootBtn");
      const bootError = document.getElementById("bootError");
      const pinDots = document.getElementById("pinDots");
      const pinError = document.getElementById("pinError");
      const staffStatusBtn = document.getElementById("staffStatusBtn");
      const staffEnterBtn = document.getElementById("staffEnterBtn");
      const staffLogoutBtn = document.getElementById("staffLogoutBtn");
      const staffRosterModalEl = document.getElementById("staffRosterModal");
      const staffRosterModal = staffRosterModalEl ? new bootstrap.Modal(staffRosterModalEl) : null;
      const staffAuthModalEl = document.getElementById("staffAuthModal");
      const staffAuthModalMessage = document.getElementById("staffAuthModalMessage");
      const staffAuthModalOkBtn = document.getElementById("staffAuthModalOkBtn");
      const staffAuthModal = staffAuthModalEl
        ? new bootstrap.Modal(staffAuthModalEl, { backdrop: "static", keyboard: false })
        : null;
      let staffAuthModalOnOk = null;

      function staffDisplayName(data) {
        const name = data && data.staff && data.staff.name ? String(data.staff.name).trim() : "";
        return name || "User";
      }

      function showStaffAuthNotice(message, onOk) {
        if (staffAuthModalMessage) staffAuthModalMessage.textContent = message;
        staffAuthModalOnOk = typeof onOk === "function" ? onOk : null;
        staffAuthModal?.show();
      }
      const rosterPinSection = document.getElementById("rosterPinSection");
      const rosterListSection = document.getElementById("rosterListSection");
      const rosterMgrPinDots = document.getElementById("rosterMgrPinDots");
      const rosterMgrPinError = document.getElementById("rosterMgrPinError");
      const rosterViewBtn = document.getElementById("rosterViewBtn");
      const rosterStaffList = document.getElementById("rosterStaffList");
      const rosterLoginAsBtn = document.getElementById("rosterLoginAsBtn");
      const rosterLogoutAsBtn = document.getElementById("rosterLogoutAsBtn");
      const rosterActionError = document.getElementById("rosterActionError");
      const tablesLink = document.getElementById("tablesLink");
      const posLink = document.getElementById("posLink");
      const screenTitle = document.getElementById("screenTitle");
      const screenSubtitle = document.getElementById("screenSubtitle");

      let pin = "";
      let loggedInStaffList = [];
      let rosterMgrPin = "";
      let verifiedManagerPin = "";
      let rosterStaff = [];
      let selectedRosterStaffId = null;

      const params = new URLSearchParams(window.location.search);
      const OPEN_TABLES_URL = "/tables/list";

      function isSwitchingUser() {
        return params.get("switch") === "1";
      }

      const returnUrl = isSwitchingUser()
        ? OPEN_TABLES_URL
        : (params.get("return") || "/tables");

      function getTheme() {
        return document.documentElement.getAttribute("data-bs-theme") || "light";
      }
      function setTheme(theme) {
        document.documentElement.setAttribute("data-bs-theme", theme);
        localStorage.setItem("theme", theme);
        updateThemeToggleLabel();
      }
      function updateThemeToggleLabel() {
        themeToggle.textContent = getTheme() === "dark" ? "Night" : "Day";
      }

      function getCompanyToken() {
        return localStorage.getItem("access_token");
      }
      function requireCompanyTokenOrRedirect() {
        const t = getCompanyToken();
        if (!t) window.location.assign("/login");
        return t;
      }

      function clearStaffLocal() {
        localStorage.removeItem("staff_token");
        localStorage.removeItem("staff_id");
        localStorage.removeItem("staff_name");
        localStorage.removeItem("staff_role");
        sessionStorage.removeItem("pos_authorized");
        sessionStorage.removeItem("closed_tables_authorized");
        sessionStorage.removeItem("closed_tables_mgr_pin");
      }

      function show(el, message) {
        el.textContent = message;
        el.classList.remove("d-none");
      }
      function hide(el) {
        el.textContent = "";
        el.classList.add("d-none");
      }

      function updatePinUI() {
        const size = pin.length >= 5 ? 5 : 4;
        const slots = [];
        for (let i = 0; i < size; i++) slots.push(i < pin.length ? "•" : "_");
        pinDots.textContent = slots.join(" ");
        const validPin = pin.length === 4 || pin.length === 5;
        const pinEmpty = pin.length === 0;
        if (staffStatusBtn) staffStatusBtn.disabled = !pinEmpty;
        staffLogoutBtn.disabled = !validPin;
      }

      function updateRosterMgrPinUI() {
        const size = rosterMgrPin.length >= 5 ? 5 : 4;
        const slots = [];
        for (let i = 0; i < size; i++) slots.push(i < rosterMgrPin.length ? "•" : "_");
        rosterMgrPinDots.textContent = slots.join(" ");
        rosterViewBtn.disabled = !(rosterMgrPin.length === 4 || rosterMgrPin.length === 5);
      }

      function resetRosterModal() {
        rosterMgrPin = "";
        verifiedManagerPin = "";
        rosterStaff = [];
        selectedRosterStaffId = null;
        rosterPinSection.classList.remove("d-none");
        rosterListSection.classList.add("d-none");
        rosterLoginAsBtn.classList.add("d-none");
        rosterLoginAsBtn.disabled = true;
        rosterLogoutAsBtn.classList.add("d-none");
        rosterLogoutAsBtn.disabled = true;
        rosterMgrPinError.classList.add("d-none");
        rosterActionError.classList.add("d-none");
        rosterStaffList.innerHTML = "";
        updateRosterMgrPinUI();
      }

      function openStaffRosterModal() {
        if (pin.length > 0) return;
        resetRosterModal();
        staffRosterModal?.show();
      }

      function renderRosterList(staff) {
        rosterStaffList.innerHTML = "";
        selectedRosterStaffId = null;
        rosterLoginAsBtn.disabled = true;
        rosterLogoutAsBtn.disabled = true;
        for (const s of staff) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "list-group-item list-group-item-action d-flex justify-content-between align-items-center";
          btn.dataset.staffId = String(s.id);
          const loggedIn = !!s.logged_in;
          if (loggedIn) btn.classList.add("list-group-item-success");
          btn.innerHTML = `<span><span class="fw-semibold">${escapeHtml(s.name)}</span> <span class="text-body-secondary small">(${escapeHtml(s.role)})</span></span><span class="badge ${loggedIn ? "text-bg-success" : "text-bg-secondary"}">${loggedIn ? "Logged in" : "Not logged in"}</span>`;
          btn.addEventListener("click", () => {
            rosterStaffList.querySelectorAll(".list-group-item").forEach((el) => el.classList.remove("active"));
            btn.classList.add("active");
            selectedRosterStaffId = s.id;
            const sel = rosterStaff.find((x) => x.id === s.id);
            updateRosterActionButtons();
          });
          rosterStaffList.appendChild(btn);
        }
      }

      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      async function loadRosterWithManagerPin() {
        rosterMgrPinError.classList.add("d-none");
        const token = requireCompanyTokenOrRedirect();
        if (!token) return;
        rosterViewBtn.disabled = true;
        rosterViewBtn.textContent = "Loading…";
        try {
          const res = await fetch("/api/staff/manager-roster", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ manager_pin: rosterMgrPin }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            rosterMgrPinError.textContent = res.status === 401 ? "Access denied." : data.message || "Could not load staff.";
            rosterMgrPinError.classList.remove("d-none");
            rosterMgrPin = "";
            updateRosterMgrPinUI();
            return;
          }
          verifiedManagerPin = rosterMgrPin;
          rosterStaff = Array.isArray(data.staff) ? data.staff : [];
          rosterPinSection.classList.add("d-none");
          rosterListSection.classList.remove("d-none");
          rosterLoginAsBtn.classList.remove("d-none");
          rosterLogoutAsBtn.classList.remove("d-none");
          renderRosterList(rosterStaff);
        } catch (e) {
          rosterMgrPinError.textContent = "Network error.";
          rosterMgrPinError.classList.remove("d-none");
        } finally {
          rosterViewBtn.textContent = "View staff";
          updateRosterMgrPinUI();
        }
      }

      async function managerLoginSelected() {
        rosterActionError.classList.add("d-none");
        if (!selectedRosterStaffId || !verifiedManagerPin) return;
        const token = requireCompanyTokenOrRedirect();
        if (!token) return;
        rosterLoginAsBtn.disabled = true;
        rosterLoginAsBtn.textContent = "Logging in…";
        try {
          const res = await fetch("/api/staff/manager-login-as", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ manager_pin: verifiedManagerPin, staff_id: selectedRosterStaffId }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            rosterActionError.textContent =
              data && data.message ? data.message : data && data.error ? data.error : "Could not log in user.";
            rosterActionError.classList.remove("d-none");
            return;
          }
          storeStaffAuth(data);
          await loadSession();
          const res2 = await fetch("/api/staff/manager-roster", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ manager_pin: verifiedManagerPin }),
          });
          const data2 = await res2.json().catch(() => ({}));
          if (res2.ok) {
            rosterStaff = Array.isArray(data2.staff) ? data2.staff : [];
            renderRosterList(rosterStaff);
            updateRosterActionButtons();
          }
        } catch (e) {
          rosterActionError.textContent = "Network error.";
          rosterActionError.classList.remove("d-none");
        } finally {
          rosterLoginAsBtn.textContent = "Log in selected";
          updateRosterActionButtons();
        }
      }

      function updateRosterActionButtons() {
        const sel = rosterStaff.find((x) => x.id === selectedRosterStaffId);
        if (!sel) {
          rosterLoginAsBtn.disabled = true;
          rosterLogoutAsBtn.disabled = true;
          rosterLoginAsBtn.textContent = "Log in selected";
          rosterLogoutAsBtn.textContent = "Log out selected";
          return;
        }
        rosterLoginAsBtn.disabled = !!sel.logged_in;
        rosterLogoutAsBtn.disabled = !sel.logged_in;
        rosterLoginAsBtn.textContent = sel.logged_in ? "Already logged in" : `Log in ${sel.name}`;
        rosterLogoutAsBtn.textContent = sel.logged_in ? `Log out ${sel.name}` : "Not logged in";
      }

      async function managerLogoutSelected() {
        rosterActionError.classList.add("d-none");
        if (!selectedRosterStaffId || !verifiedManagerPin) return;
        const token = requireCompanyTokenOrRedirect();
        if (!token) return;
        rosterLogoutAsBtn.disabled = true;
        rosterLogoutAsBtn.textContent = "Logging out…";
        try {
          const res = await fetch("/api/staff/manager-logout-as", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ manager_pin: verifiedManagerPin, staff_id: selectedRosterStaffId }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            rosterActionError.textContent =
              data && data.message ? data.message : data && data.error ? data.error : "Could not log out user.";
            rosterActionError.classList.remove("d-none");
            return;
          }
          const myId = localStorage.getItem("staff_id");
          if (myId && String(selectedRosterStaffId) === myId) clearStaffLocal();
          const res2 = await fetch("/api/staff/manager-roster", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ manager_pin: verifiedManagerPin }),
          });
          const data2 = await res2.json().catch(() => ({}));
          if (res2.ok) {
            rosterStaff = Array.isArray(data2.staff) ? data2.staff : [];
            renderRosterList(rosterStaff);
          }
          await loadSession();
        } catch (e) {
          rosterActionError.textContent = "Network error.";
          rosterActionError.classList.remove("d-none");
        } finally {
          rosterLogoutAsBtn.textContent = "Log out selected";
          updateRosterActionButtons();
        }
      }

      function goToReturnUrl() {
        const dest = returnUrl.startsWith("/") ? returnUrl : "/tables";
        window.location.assign(dest);
      }

      function storeStaffAuth(data) {
        if (data.staff_token) localStorage.setItem("staff_token", data.staff_token);
        if (data.staff && data.staff.id != null) localStorage.setItem("staff_id", String(data.staff.id));
        if (data.staff && data.staff.name) localStorage.setItem("staff_name", data.staff.name);
        if (data.staff && data.staff.role) localStorage.setItem("staff_role", data.staff.role);
      }

      function updateSessionUI() {
        const anyLoggedIn = loggedInStaffList.length > 0;
        const hasTerminalSession = !!localStorage.getItem("staff_token");
        if (!hasTerminalSession && !anyLoggedIn) {
          tablesLink.classList.add("d-none");
          posLink.classList.add("d-none");
        } else if (anyLoggedIn || hasTerminalSession) {
          tablesLink.classList.remove("d-none");
          posLink.classList.remove("d-none");
        } else {
          tablesLink.classList.add("d-none");
          posLink.classList.add("d-none");
        }
        if (isSwitchingUser()) {
          screenSubtitle.textContent = "Enter your PIN and press Enter. Use Logout to end a shift.";
        } else if (anyLoggedIn) {
          screenSubtitle.textContent = "Enter your PIN and press Enter. Use Logout to end a shift.";
        } else {
          screenSubtitle.textContent = "Enter your PIN and press Enter to log in.";
          screenTitle.textContent = "Staff PIN";
        }
        updatePinUI();
      }

      async function loadSession() {
        const token = requireCompanyTokenOrRedirect();
        if (!token) return;
        try {
          const res = await fetch("/api/staff/session", {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await res.json().catch(() => ({}));
          if (res.status === 401) {
            localStorage.removeItem("access_token");
            window.location.assign("/login");
            return;
          }
          if (!res.ok) {
            loggedInStaffList = [];
            clearStaffLocal();
            updateSessionUI();
            return;
          }
          loggedInStaffList = Array.isArray(data.logged_in_staff) ? data.logged_in_staff : [];
          const sid = localStorage.getItem("staff_id");
          if (sid && !loggedInStaffList.some((s) => String(s.id) === sid)) {
            clearStaffLocal();
          }
          updateSessionUI();
        } catch (e) {
          loggedInStaffList = [];
          updateSessionUI();
        }
      }

      async function bootstrapManager() {
        hide(bootError);
        const token = requireCompanyTokenOrRedirect();
        if (!token) return;
        const name = (bootName.value || "").trim() || "Manager";
        const bootPinVal = String(bootPin.value || "").trim();
        if (!/^\d{4,5}$/.test(bootPinVal)) {
          show(bootError, "PIN must be 4–5 digits.");
          return;
        }
        bootBtn.disabled = true;
        bootBtn.textContent = "Creating…";
        try {
          const res = await fetch("/api/staff/bootstrap-manager", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ name, pin: bootPinVal }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            show(bootError, data && data.error ? `Failed: ${data.error}` : "Failed to create manager.");
            return;
          }
          bootstrapWrap.classList.add("d-none");
          pinPadWrap.classList.remove("d-none");
        } catch (e) {
          show(bootError, "Network error.");
        } finally {
          bootBtn.disabled = false;
          bootBtn.textContent = "Create Manager";
        }
      }

      async function checkStaffExists() {
        const token = requireCompanyTokenOrRedirect();
        if (!token) return;
        try {
          const res = await fetch("/api/staff", { headers: { Authorization: `Bearer ${token}` } });
          const data = await res.json().catch(() => null);
          if (res.status === 401) {
            localStorage.removeItem("access_token");
            window.location.assign("/login");
            return;
          }
          const hasStaff = Array.isArray(data) && data.length > 0;
          bootstrapWrap.classList.toggle("d-none", hasStaff);
          pinPadWrap.classList.toggle("d-none", !hasStaff);
        } catch (e) {
          bootstrapWrap.classList.add("d-none");
        }
      }

      async function doStaffEnter() {
        hide(pinError);

        if (localStorage.getItem("staff_token")) {
          goToReturnUrl();
          return;
        }

        const token = requireCompanyTokenOrRedirect();
        if (!token) return;

        const validPin = pin.length === 4 || pin.length === 5;
        staffEnterBtn.disabled = true;
        staffEnterBtn.textContent = validPin ? "Checking…" : "Entering…";

        try {
          if (validPin) {
            const loggedInBefore = new Set(loggedInStaffList.map((s) => s.id));
            const res = await fetch("/api/staff/pin-login", {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
              body: JSON.stringify({ pin }),
            });
            const data = await res.json().catch(() => ({}));
            if (res.status === 401 || !res.ok || !data.staff_token) {
              show(pinError, "Access denied.");
              return;
            }
            const staffId = data.staff && data.staff.id != null ? data.staff.id : null;
            const newlyLoggedIn = staffId != null && !loggedInBefore.has(staffId);
            storeStaffAuth(data);
            pin = "";
            updatePinUI();
            if (newlyLoggedIn) {
              const name = staffDisplayName(data);
              showStaffAuthNotice(`${name} logged in`, () => goToReturnUrl());
            } else {
              goToReturnUrl();
            }
            return;
          }

          if (!loggedInStaffList.length) {
            show(pinError, "Access denied.");
            return;
          }

          let staffId = Number.parseInt(localStorage.getItem("staff_id") || "", 10);
          if (!Number.isFinite(staffId) && loggedInStaffList.length === 1) {
            staffId = loggedInStaffList[0].id;
          }
          if (!Number.isFinite(staffId)) {
            show(pinError, "Access denied.");
            return;
          }

          const res = await fetch("/api/staff/enter", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ staff_id: staffId }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.staff_token) {
            show(pinError, "Access denied.");
            return;
          }
          storeStaffAuth(data);
          goToReturnUrl();
        } catch (e) {
          show(pinError, "Network error.");
        } finally {
          staffEnterBtn.disabled = false;
          staffEnterBtn.textContent = "Enter";
          updatePinUI();
        }
      }

      async function doStaffLogout() {
        hide(pinError);
        const token = requireCompanyTokenOrRedirect();
        if (!token) return;
        if (!(pin.length === 4 || pin.length === 5)) {
          show(pinError, "Enter a 4–5 digit PIN.");
          return;
        }
        staffLogoutBtn.disabled = true;
        staffLogoutBtn.textContent = "Logging out…";
        try {
          const res = await fetch("/api/staff/pin-logout", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ pin }),
          });
          const data = await res.json().catch(() => ({}));
          if (res.status === 401) {
            show(pinError, data && data.message ? data.message : "Invalid PIN.");
            return;
          }
          if (!res.ok) {
            show(pinError, data && data.message ? data.message : data && data.error ? `Logout failed: ${data.error}` : "Logout failed.");
            return;
          }
          if (data.staff && data.staff.id != null) {
            const loggedOutId = String(data.staff.id);
            if (localStorage.getItem("staff_id") === loggedOutId) clearStaffLocal();
          }
          pin = "";
          updatePinUI();
          const name = staffDisplayName(data);
          showStaffAuthNotice(`${name} logged out`, () => loadSession());
        } catch (e) {
          show(pinError, "Network error.");
        } finally {
          staffLogoutBtn.textContent = "Logout";
          updatePinUI();
        }
      }

      document.querySelectorAll(".key").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (pin.length >= 5) return;
          pin += btn.getAttribute("data-key");
          updatePinUI();
        });
      });
      document.getElementById("clearPin").addEventListener("click", () => {
        pin = "";
        updatePinUI();
      });
      document.getElementById("backPin").addEventListener("click", () => {
        pin = pin.slice(0, -1);
        updatePinUI();
      });
      staffAuthModalOkBtn?.addEventListener("click", () => {
        staffAuthModal?.hide();
        const fn = staffAuthModalOnOk;
        staffAuthModalOnOk = null;
        if (fn) fn();
      });

      staffStatusBtn.addEventListener("click", openStaffRosterModal);
      staffEnterBtn.addEventListener("click", doStaffEnter);
      staffLogoutBtn.addEventListener("click", doStaffLogout);
      bootBtn.addEventListener("click", bootstrapManager);
      themeToggle.addEventListener("click", () => setTheme(getTheme() === "dark" ? "light" : "dark"));

      document.querySelectorAll(".roster-mgr-key").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (rosterMgrPin.length >= 5) return;
          rosterMgrPin += btn.getAttribute("data-key");
          updateRosterMgrPinUI();
        });
      });
      document.getElementById("rosterMgrClear")?.addEventListener("click", () => {
        rosterMgrPin = "";
        updateRosterMgrPinUI();
      });
      document.getElementById("rosterMgrBack")?.addEventListener("click", () => {
        rosterMgrPin = rosterMgrPin.slice(0, -1);
        updateRosterMgrPinUI();
      });
      rosterViewBtn.addEventListener("click", loadRosterWithManagerPin);
      rosterLoginAsBtn.addEventListener("click", managerLoginSelected);
      rosterLogoutAsBtn.addEventListener("click", managerLogoutSelected);
      if (staffRosterModalEl) {
        staffRosterModalEl.addEventListener("hidden.bs.modal", resetRosterModal);
      }

      requireCompanyTokenOrRedirect();
      if (isSwitchingUser()) clearStaffLocal();
      updateThemeToggleLabel();
      updatePinUI();
      checkStaffExists();
      loadSession();
    </script>
    <script>
      (function () {
        const mgmt = ["/products", "/categories", "/accounts", "/staff/new", "/settings", "/cashups", "/cash-ups"];
        const path = window.location.pathname || "";
        if (!mgmt.some((p) => path === p || path.startsWith(p + "/"))) {
          sessionStorage.removeItem("pos_authorized");
        }
      })();
      if (window.location.pathname !== "/tables/closed" && !/^\/tables\/\d+\/order\/closed$/.test(window.location.pathname)) {
        sessionStorage.removeItem("closed_tables_authorized");
        sessionStorage.removeItem("closed_tables_mgr_pin");
      }
    </script>
  </body>
</html>
