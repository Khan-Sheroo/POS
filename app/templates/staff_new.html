<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create User • POS System</title>
    <script>
      (function () {
        const stored = localStorage.getItem("theme");
        const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = stored || (systemDark ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", theme);
      })();
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar bg-body border-bottom">
      <div class="container">
        <a class="navbar-brand" href="/tables">Create user</a>
        <div class="ms-auto d-flex gap-2">
          <button id="themeToggle" class="btn btn-outline-primary btn-sm" type="button">Theme</button>
          <button id="logoutBtn" class="btn btn-outline-secondary btn-sm" type="button">Switch user</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-7">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h4 mb-1">Create new user</h1>
              <p class="text-body-secondary mb-4">
                Manager-only. Creates a staff account with a 4–5 digit PIN.
              </p>

              <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>
              <div id="successBox" class="alert alert-success d-none" role="alert"></div>

              <form id="form" class="row g-3" novalidate>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="firstName">First name</label>
                  <input id="firstName" class="form-control" required />
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="lastName">Last name</label>
                  <input id="lastName" class="form-control" required />
                </div>
                <div class="col-12">
                  <label class="form-label" for="position">Position</label>
                  <select id="position" class="form-select" required>
                    <option value="manager">Manager</option>
                    <option value="waiter">Waiter</option>
                    <option value="bartender">Bartender</option>
                    <option value="clerk">Clerk</option>
                  </select>
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="pin">Create PIN (4–5 digits)</label>
                  <input id="pin" class="form-control" inputmode="numeric" pattern="\\d*" maxlength="5" required />
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="pin2">Confirm PIN</label>
                  <input id="pin2" class="form-control" inputmode="numeric" pattern="\\d*" maxlength="5" required />
                </div>
                <div class="col-12 d-grid gap-2">
                  <button id="submitBtn" class="btn btn-primary btn-lg" type="submit">Create user</button>
                  <a class="btn btn-outline-secondary" href="/tables">Back</a>
                </div>
              </form>
            </div>
          </div>
          <p class="text-center text-body-secondary mt-3 mb-0 small">
            Requires staff manager login (<code>localStorage.staff_token</code>).
          </p>
        </div>
      </div>
    </main>

    <script>
      const themeToggle = document.getElementById("themeToggle");
      const logoutBtn = document.getElementById("logoutBtn");

      const form = document.getElementById("form");
      const submitBtn = document.getElementById("submitBtn");
      const errorBox = document.getElementById("errorBox");
      const successBox = document.getElementById("successBox");

      function getTheme() {
        return document.documentElement.getAttribute("data-bs-theme") || "light";
      }
      function setTheme(theme) {
        document.documentElement.setAttribute("data-bs-theme", theme);
        localStorage.setItem("theme", theme);
        updateThemeToggleLabel();
      }
      function updateThemeToggleLabel() {
        themeToggle.textContent = getTheme() === "dark" ? "Night" : "Day";
      }

      function show(el, msg) {
        el.textContent = msg;
        el.classList.remove("d-none");
      }
      function hide(el) {
        el.textContent = "";
        el.classList.add("d-none");
      }

      function requireTokensOrRedirect() {
        const company = localStorage.getItem("access_token");
        if (!company) window.location.assign("/login");
        const staff = localStorage.getItem("staff_token");
        if (!staff) window.location.assign("/staff/login");
        return { company, staff };
      }

      logoutBtn.addEventListener("click", () => {
        localStorage.removeItem("staff_token");
        localStorage.removeItem("staff_id");
        localStorage.removeItem("staff_name");
        localStorage.removeItem("staff_role");
        sessionStorage.removeItem("pos_authorized");
        window.location.assign("/staff/login?switch=1");
      });
      themeToggle.addEventListener("click", () => setTheme(getTheme() === "dark" ? "light" : "dark"));

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hide(errorBox);
        hide(successBox);

        const { staff } = requireTokensOrRedirect();
        if (!staff) return;

        const first_name = (document.getElementById("firstName").value || "").trim();
        const last_name = (document.getElementById("lastName").value || "").trim();
        const position = document.getElementById("position").value;
        const pin = String(document.getElementById("pin").value || "").trim();
        const pin2 = String(document.getElementById("pin2").value || "").trim();

        if (!first_name || !last_name) return show(errorBox, "First and last name are required.");
        if (!["manager", "waiter", "bartender", "clerk"].includes(position))
          return show(errorBox, "Invalid position.");
        if (!/^\d{4,5}$/.test(pin)) return show(errorBox, "PIN must be 4–5 digits.");
        if (pin !== pin2) return show(errorBox, "PINs do not match.");

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating…";
        try {
          const res = await fetch("/api/staff", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${staff}`,
            },
            body: JSON.stringify({ first_name, last_name, position, pin }),
          });
          const data = await res.json().catch(() => ({}));

          if (res.status === 401) {
            localStorage.removeItem("access_token");
            localStorage.removeItem("staff_token");
            window.location.assign("/login");
            return;
          }
          if (res.status === 403) {
            window.location.assign("/staff/login");
            return;
          }
          if (!res.ok) {
            return show(errorBox, data && data.error ? `Failed: ${data.error}` : "Failed to create user.");
          }

          show(successBox, `Created: ${data.name} (${data.role})`);
          form.reset();
          document.getElementById("firstName").focus();
        } catch (err) {
          show(errorBox, "Network error.");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Create user";
        }
      });

      requireTokensOrRedirect();
      updateThemeToggleLabel();
    </script>
  </body>
</html>
