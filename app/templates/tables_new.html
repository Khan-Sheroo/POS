<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Table • POS System</title>
    <script>
      (function () {
        const stored = localStorage.getItem("theme");
        const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = stored || (systemDark ? "dark" : "light");
        document.documentElement.setAttribute("data-bs-theme", theme);
      })();
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar bg-body border-bottom">
      <div class="container">
        <a class="navbar-brand" href="/tables">Tables</a>
        <div class="ms-auto d-flex gap-2 flex-wrap">
          <a href="/tables/list" class="btn btn-outline-primary btn-sm">POS</a>
          <a href="/tables/list" class="btn btn-outline-dark btn-sm">Show Tables</a>
          <button id="themeToggle" class="btn btn-outline-primary btn-sm" type="button">Theme</button>
          <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Switch user</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h4 mb-1">Create new table</h1>
              <p class="text-body-secondary mb-4">Configure table number and pax count.</p>

              <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>
              <div id="successBox" class="alert alert-success d-none" role="alert"></div>

              <form id="newTableForm" class="row g-3" novalidate>
                <div class="col-12">
                  <label for="tableNumber" class="form-label">Table number</label>
                  <input
                    type="number"
                    class="form-control"
                    id="tableNumber"
                    min="1"
                    step="1"
                    inputmode="numeric"
                    required
                  />
                </div>
                <div class="col-12">
                  <label for="paxCount" class="form-label">Pax count</label>
                  <input
                    type="number"
                    class="form-control"
                    id="paxCount"
                    min="1"
                    step="1"
                    inputmode="numeric"
                    required
                  />
                </div>
                <div class="col-12 d-grid gap-2">
                  <button id="submitBtn" class="btn btn-primary btn-lg" type="submit">Create table</button>
                  <a class="btn btn-outline-secondary" href="/tables">Back</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Table exists + manager PIN keypad -->
    <div class="modal fade" id="tableExistsModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Table already open</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div id="tableExistsText" class="mb-0"></div>
            <div class="text-body-secondary small mt-2">To open this table you need manager authorization.</div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button id="tableExistsViewBtn" type="button" class="btn btn-primary">Open existing table</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="managerPinModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Manager PIN required</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="text-center">
              <div class="fw-semibold">Enter manager PIN</div>
              <div class="fs-3 fw-semibold mt-2" id="mgrPinDots">_ _ _ _</div>
            </div>
            <div id="mgrPinError" class="alert alert-danger d-none mt-3 mb-0" role="alert"></div>

            <div class="row g-2 mt-3 justify-content-center">
              <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 mgr-key" data-key="1">1</button></div>
              <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 mgr-key" data-key="2">2</button></div>
              <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 mgr-key" data-key="3">3</button></div>
              <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 mgr-key" data-key="4">4</button></div>
              <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 mgr-key" data-key="5">5</button></div>
              <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 mgr-key" data-key="6">6</button></div>
              <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 mgr-key" data-key="7">7</button></div>
              <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 mgr-key" data-key="8">8</button></div>
              <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 mgr-key" data-key="9">9</button></div>
              <div class="col-4"><button id="mgrClear" class="btn btn-outline-danger w-100 py-3">Clear</button></div>
              <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 mgr-key" data-key="0">0</button></div>
              <div class="col-4"><button id="mgrBack" class="btn btn-outline-secondary w-100 py-3">⌫</button></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button id="mgrAuthorizeBtn" type="button" class="btn btn-primary" disabled>Authorize</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const themeToggle = document.getElementById("themeToggle");
      const logoutBtn = document.getElementById("logoutBtn");
      const form = document.getElementById("newTableForm");
      const submitBtn = document.getElementById("submitBtn");
      const errorBox = document.getElementById("errorBox");
      const successBox = document.getElementById("successBox");

      const tableExistsModalEl = document.getElementById("tableExistsModal");
      const tableExistsModal = new bootstrap.Modal(tableExistsModalEl);
      const tableExistsText = document.getElementById("tableExistsText");
      const tableExistsViewBtn = document.getElementById("tableExistsViewBtn");

      const managerPinModalEl = document.getElementById("managerPinModal");
      const managerPinModal = new bootstrap.Modal(managerPinModalEl);
      const mgrPinDots = document.getElementById("mgrPinDots");
      const mgrPinError = document.getElementById("mgrPinError");
      const mgrAuthorizeBtn = document.getElementById("mgrAuthorizeBtn");
      let mgrPin = "";
      let pendingOpen = null; // { table_number, pax_count }

      function getTheme() {
        return document.documentElement.getAttribute("data-bs-theme") || "light";
      }

      function setTheme(theme) {
        document.documentElement.setAttribute("data-bs-theme", theme);
        localStorage.setItem("theme", theme);
        updateThemeToggleLabel();
      }

      function updateThemeToggleLabel() {
        const theme = getTheme();
        themeToggle.textContent = theme === "dark" ? "Night" : "Day";
      }

      function getToken() {
        return localStorage.getItem("staff_token") || localStorage.getItem("access_token");
      }

      function requireTokenOrRedirect() {
        const staff = localStorage.getItem("staff_token");
        if (!staff) {
          const ret = encodeURIComponent(window.location.pathname + window.location.search);
          window.location.assign(`/staff/login?reason=login_required&return=${ret}`);
          return null;
        }
        return staff;
      }

      function switchStaffUser() {
        localStorage.removeItem("staff_token");
        localStorage.removeItem("staff_id");
        localStorage.removeItem("staff_name");
        localStorage.removeItem("staff_role");
        sessionStorage.removeItem("pos_authorized");
        window.location.assign("/staff/login?switch=1");
      }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.remove("d-none");
      }

      function clearError() {
        errorBox.textContent = "";
        errorBox.classList.add("d-none");
      }

      function showSuccess(message) {
        successBox.textContent = message;
        successBox.classList.remove("d-none");
      }

      function clearSuccess() {
        successBox.textContent = "";
        successBox.classList.add("d-none");
      }

      function show(el, msg) {
        el.textContent = msg;
        el.classList.remove("d-none");
      }
      function hide(el) {
        el.textContent = "";
        el.classList.add("d-none");
      }

      function updateMgrPinUI() {
        const size = mgrPin.length >= 5 ? 5 : 4;
        const slots = [];
        for (let i = 0; i < size; i++) slots.push(i < mgrPin.length ? "•" : "_");
        mgrPinDots.textContent = slots.join(" ");
        mgrAuthorizeBtn.disabled = !(mgrPin.length === 4 || mgrPin.length === 5);
      }

      function openMgrPinModal() {
        mgrPin = "";
        hide(mgrPinError);
        updateMgrPinUI();
        managerPinModal.show();
      }

      async function authorizeAndOpen() {
        hide(mgrPinError);
        const token = requireTokenOrRedirect();
        if (!token || !pendingOpen) return;
        try {
          const authRes = await fetch("/api/staff/authorize-manager", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ pin: mgrPin }),
          });
          const authData = await authRes.json().catch(() => ({}));
          if (!authRes.ok) {
            show(mgrPinError, authData && authData.error ? `Failed: ${authData.error}` : "Authorization failed.");
            return;
          }
          const retry = await fetch("/api/tables", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
            body: JSON.stringify({ table_number: pendingOpen.table_number, pax_count: pendingOpen.pax_count, manager_pin: mgrPin }),
          });
          const retryData = await retry.json().catch(() => ({}));
          if (!retry.ok) {
            show(mgrPinError, retryData && retryData.error ? `Failed: ${retryData.error}` : "Failed to open table.");
            return;
          }
          managerPinModal.hide();
          window.open(`/tables/${retryData.id}/order`, "_blank", "noopener,noreferrer");
          window.location.assign("/tables/list");
        } catch (e) {
          show(mgrPinError, "Network error.");
        }
      }

      logoutBtn.addEventListener("click", switchStaffUser);

      themeToggle.addEventListener("click", () => {
        setTheme(getTheme() === "dark" ? "light" : "dark");
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearError();
        clearSuccess();

        const token = requireTokenOrRedirect();
        if (!token) return;

        const table_number = Number.parseInt(document.getElementById("tableNumber").value, 10);
        const pax_count = Number.parseInt(document.getElementById("paxCount").value, 10);

        if (!Number.isFinite(table_number) || table_number <= 0) {
          showError("Table number must be a positive integer.");
          return;
        }
        if (!Number.isFinite(pax_count) || pax_count <= 0) {
          showError("Pax count must be a positive integer.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating…";

        try {
          const res = await fetch("/api/tables", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ table_number, pax_count }),
          });

          const data = await res.json().catch(() => ({}));

          if (res.status === 401) {
            localStorage.removeItem("access_token");
            window.location.assign("/login");
            return;
          }

          if (res.status === 409 && data && data.error === "table_exists_owned_by_other") {
            const ownerName = data.opened_by_staff && data.opened_by_staff.name ? data.opened_by_staff.name : "another user";
            pendingOpen = { table_number, pax_count };
            tableExistsText.textContent = `This Table already exists under "${ownerName}".`;
            tableExistsModal.show();
            return;
          }
          if (!res.ok) {
            showError(data.error ? `Failed: ${data.error}` : "Failed to create table.");
            return;
          }

          // Open order screen in a new window/tab, then return user to POS.
          window.open(`/tables/${data.id}/order`, "_blank", "noopener,noreferrer");
          window.location.assign("/tables/list");
        } catch (err) {
          showError("Network error. Please try again.");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Create table";
        }
      });

      requireTokenOrRedirect();
      updateThemeToggleLabel();

      tableExistsViewBtn.addEventListener("click", () => {
        tableExistsModal.hide();
        openMgrPinModal();
      });
      document.querySelectorAll(".mgr-key").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (mgrPin.length >= 5) return;
          mgrPin += btn.getAttribute("data-key");
          updateMgrPinUI();
        });
      });
      document.getElementById("mgrClear").addEventListener("click", () => {
        mgrPin = "";
        updateMgrPinUI();
      });
      document.getElementById("mgrBack").addEventListener("click", () => {
        mgrPin = mgrPin.slice(0, -1);
        updateMgrPinUI();
      });
      mgrAuthorizeBtn.addEventListener("click", authorizeAndOpen);
    </script>

    <script>
      (function () {
        const mgmt = ["/products", "/categories", "/accounts", "/staff/new", "/settings", "/cashups", "/cash-ups"];
        const path = window.location.pathname || "";
        if (!mgmt.some((p) => path === p || path.startsWith(p + "/"))) {
          sessionStorage.removeItem("pos_authorized");
        }
      })();
    </script>
  </body>
</html>
